name: Check and build
on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l main.go main_test.go settings_test.go internal)"
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - name: Test release and server update scripts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build Ubuntu 16.04 compatible binary
        run: sh scripts/build.sh "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: panaino-bot-linux-amd64
          path: |
            dist/panaino-bot
            dist/SHA256SUMS
          retention-days: 14
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-24.04
    concurrency:
      group: panaino-bot-releases
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download the tested build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$GITHUB_RUN_ID" --name panaino-bot-linux-amd64 --dir dist
      - name: Publish binary and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh
